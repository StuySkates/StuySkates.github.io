<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StuySkates - Photos</title>

  <link rel="icon" type="image/png" href="StuySkatesLogo.png">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="photos-page">

  <header class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="StuySkatesLogo.png" alt="Stuy Skates Logo" class="nav-logo-img">
      </a>
    </div>
    <div class="nav-center">
      <a href="index.html" class="brand-title">StuySkates</a>
    </div>
    <div class="nav-right">
      <a href="contact.html" class="contact-btn">Contact</a>
    </div>
  </header>

  <!-- Side Menu Overlay & Drawer -->
  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="side-menu" id="sideMenu">
    <button class="close-btn" id="closeBtn" aria-label="Close Menu">&times;</button>
    <nav class="side-nav-links">
      <a href="index.html">Home</a>
      <a href="board.html">Board</a>
      <a href="photos.html" class="active">Photos</a>
      <a href="resources.html">Resources</a>
    </nav>
  </aside>

  <main class="photos-container">
    <h1 class="gallery-title">StuySkates Photo Gallery</h1>

    <div class="gallery-grid">
   
      <div class="gallery-item">
        <img src="2025-2026.jpg" alt="StuySkates Photo 1"
      </div>

      <!-- Add additional photo cards below by duplicating the block below
        <div class="gallery-item">
        <img src="[image name].jpg" alt="StuySkates Photo [#]"
      </div> -->
    </div>
  </main>
  
<div id="imageModal" class="modal">
    <span class="modal-close" id="modalClose">&times;</span>
    <img class="modal-content" id="fullImage" alt="Expanded Photo">
  </div>
  
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mobile Side Menu Logic
      const closeBtn = document.getElementById('closeBtn');
      const sideMenu = document.getElementById('sideMenu');
      const menuOverlay = document.getElementById('menuOverlay');

      function closeMenu() {
        if (sideMenu) sideMenu.classList.remove('active');
        if (menuOverlay) menuOverlay.classList.remove('active');
      }

      if (closeBtn) closeBtn.addEventListener('click', closeMenu);
      if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);

      
      const modal = document.getElementById('imageModal');
      const fullImg = document.getElementById('fullImage');
      const modalClose = document.getElementById('modalClose');

      document.querySelectorAll('.gallery-item img').forEach(img => {
        img.addEventListener('click', () => {
          modal.classList.add('open');
          fullImg.src = img.src;
        });
      });

      if (modalClose) {
        modalClose.addEventListener('click', () => modal.classList.remove('open'));
      }
      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) modal.classList.remove('open');
        });
      }
    });
  </script>
</body>
</html>
