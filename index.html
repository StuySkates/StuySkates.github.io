<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StuySkates</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="StuySkatesLogo.png" alt="Stuy Skates Little Logo">
      </a>
    </div>
  </header>
    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="side-menu" id="sideMenu">
        <button class="close-btn" id="closeBtn" aria-label="Close Menu">&times;</button>
        <nav class="side-nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="board.html">Board</a>
            <a href="photos.html">Photos</a>
            <a href="resources.html">Resources</a>
        </nav>
    </aside>

    <section id="contact" class="content-section">
        <h2>Contact Us</h2>
    </section>

<main id="home" class="main">
    <div class="snowflakes" aria-hidden="true">
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
  </div>
    
    <div class="main-content">
        <button class="logo-toggle-btn" id="logoToggle" type="button" aria-label="Open Menu">
            <img src="StuySkatesLogo.png" alt="Stuy Skates Big Logo" class="main-logo" id="mainLogo">
        </button>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuToggle = document.getElementById('menuToggle');
      const closeBtn = document.getElementById('closeBtn');
      const sideMenu = document.getElementById('sideMenu');
      const menuOverlay = document.getElementById('menuOverlay');
      const mainLogo = document.getElementById('mainLogo');

        function triggerLogoSpin() {
      if (!mainLogo) return;
      mainLogo.classList.remove('is-spinning');
      void mainLogo.offsetWidth;
      mainLogo.classList.add('is-spinning');
    }

  function openMenu() {
    sideMenu.classList.add('active');
    menuOverlay.classList.add('active');
    triggerLogoSpin();
    }
  }

  function closeMenu() {
    sideMenu.classList.remove('active');
    menuOverlay.classList.remove('active');
    }
  }

    if (mainLogo) {
      mainLogo.addEventListener('animationend', () => {
        mainLogo.classList.remove('is-spinning');
      });
    }

if (logoToggle) logoToggle.addEventListener('click', openMenu);
      if (closeBtn) closeBtn.addEventListener('click', closeMenu);
      if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);
    });
  </script>
</body>
</html>
