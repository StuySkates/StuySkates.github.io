<!DOCTYPE html>
<html>
<head>
    <title>StuySkates</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="StuySkatesLogo.png" alt="Stuy Skates Logo">
      </a>
    </div>
  </header>
    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="side-menu" id="sideMenu">
        <button class="close-btn" id="closeBtn" aria-label="Close Menu">&times;</button>
        <nav class="side-nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="board.html">Board</a>
            <a href="photos.html">Photos</a>
            <a href="resources.html">Resources</a>
        </nav>
    </aside>
    
    <section id="contact" class="content-section">
        <h2>Contact Us</h2>
    </section>

        
<main id="home" class="main">
    <div class="snowflakes" aria-hidden="true">
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
  </div>
    
    <div class="main-content">
        <button class="logo-toggle-btn" id="logoToggle" aria-label="Open Menu">
            <img src="StuySkatesLogo.png" alt="Stuy Skates Logo" class="main-logo" id="mainLogo">
        </button>
    </div>
</main>
    
</body>

<script>
  const menuToggle = document.getElementById('menuToggle');
  const closeBtn = document.getElementById('closeBtn');
  const sideMenu = document.getElementById('sideMenu');
  const menuOverlay = document.getElementById('menuOverlay');
  const mainLogo = document.getElementById('mainLogo');

  function openMenu() {
    sideMenu.classList.add('active');
    menuOverlay.classList.add('active');
    if (mainLogo) {
      mainLogo.classList.add('active-spin');
    }
  }

  function closeMenu() {
    sideMenu.classList.remove('active');
    menuOverlay.classList.remove('active');
    if (mainLogo) {
      mainLogo.classList.remove('active-spin');
    }
  }

  menuToggle.addEventListener('click', openMenu);
  closeBtn.addEventListener('click', closeMenu);
  menuOverlay.addEventListener('click', closeMenu);
</script>
</body>
</html>
