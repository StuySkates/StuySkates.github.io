<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StuySkates - Contact Us</title>

  <link rel="icon" type="image/png" href="StuySkatesLogo.png">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">

  <header class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="StuySkatesLogo.png" alt="Stuy Skates Logo" class="nav-logo-img">
      </a>
    </div>
    <div class="nav-center">
      <a href="index.html" class="brand-title">StuySkates</a>
    </div>
    <div class="nav-right">
      <a href="contact.html" class="contact-btn">Contact</a>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="side-menu" id="sideMenu">
    <button class="close-btn" id="closeBtn" aria-label="Close Menu">&times;</button>
    <nav class="side-nav-links">
      <a href="index.html">Home</a>
      <a href="board.html">Board</a>
      <a href="photos.html">Photos</a>
      <a href="resources.html">Resources</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </aside>

  <main class="contact-wrapper">
    <div class="contact-card">
      
      <div class="contact-form-side">
        <h1 class="contact-title">Contact Us</h1>

        <div class="direct-contact-links">
          <a href="mailto:stuyvesantskating@gmail.com" class="contact-link-item">
            <span class="link-icon">✉️</span>
            <span>stuyvesantskating@gmail.com</span>
          </a>
          <a href="https://www.instagram.com/stuyskates.official/" target="_blank" rel="noopener noreferrer" class="contact-link-item">
            <span class="link-icon">📸</span>
            <span>@stuyskates</span>
          </a>
        </div>

  <div class="divider-text">or send us a message</div>
        
        <form action="https://formspree.io/f/mljrgzaj" method="POST" class="contact-form">
          <div class="input-group">
            <span class="input-icon">👤</span>
            <input type="text" name="name" placeholder="Name" required>
          </div>

          <div class="input-group">
            <span class="input-icon">✉️</span>
            <input type="email" name="email" placeholder="Email" required>
          </div>

          <div class="input-group text-area-group">
            <textarea name="message" placeholder="Message" rows="4" required></textarea>
          </div>

          <button type="submit" class="send-btn">Send Message</button>
        </form>
      </div>

      <div class="contact-image-side">
        <img src="ContactUs.png" alt="Contact Illustration" class="contact-graphic">
      </div>

    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const closeBtn = document.getElementById('closeBtn');
      const sideMenu = document.getElementById('sideMenu');
      const menuOverlay = document.getElementById('menuOverlay');

      function closeMenu() {
        if (sideMenu) sideMenu.classList.remove('active');
        if (menuOverlay) menuOverlay.classList.remove('active');
      }

      if (closeBtn) closeBtn.addEventListener('click', closeMenu);
      if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);
    });
  </script>
</body>
</html>
