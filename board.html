<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StuySkates - Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="board-page">

  <!-- Header Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="StuySkatesLogo.png" alt="StuySkates Logo" class="nav-logo-img">
      </a>
    </div>
    <div class="nav-center">
      <a href="index.html" class="brand-title">StuySkates</a>
    </div>
    <div class="nav-right">
      <a href="contact.html" class="contact-btn">Contact</a>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="side-menu" id="sideMenu">
    <button class="close-btn" id="closeBtn" aria-label="Close Menu">&times;</button>
    <nav class="side-nav-links">
      <a href="index.html">Home</a>
      <a href="board.html" class="active">Board</a>
      <a href="photos.html">Photos</a>
      <a href="resources.html">Resources</a>
      <a href="contact.html">Contact</a>
    </nav>
  </aside>

  <main class="board-wrapper">
    
    <div class="board-header">
      <h1 class="board-main-title">StuySkates Board</h1>
      <p class="board-subtitle">Meet the team running the StuySkates club this year!</p>
    </div>

    <div class="board-container">

      <!-- Member 1 -->
  <div class="board-member-row" style="display: flex !important; flex-direction: row !important; width: 100% !important; max-width: 900px !important; margin: 0 auto 20px auto !important; gap: 20px !important; align-items: center !important;">
  
  <!-- LEFT: Rectangle Photo Box -->
  <div class="board-photo-card" style="flex: 0 0 180px !important; width: 180px !important; height: 240px !important; border-radius: 20px !important; overflow: hidden !important; background: #fff !important;">
    <img src="Darren.jpg" alt="Darren" style="width: 100% !important; height: 100% !important; max-width: 180px !important; max-height: 240px !important; object-fit: cover !important; display: block !important;">
  </div>

  <!-- RIGHT: Description Box -->
  <div class="board-text-card" style="flex: 1 !important; height: 240px !important; background-color: #ffffff !important; border-radius: 20px !important; padding: 24px 32px !important; display: flex !important; flex-direction: column !important; justify-content: center !important; box-sizing: border-box !important;">
    <span class="role-badge" style="color: #0369a1 !important; background: #e0f2fe !important; padding: 4px 12px !important; border-radius: 12px !important; font-weight: 700 !important; width: fit-content !important; margin-bottom: 8px !important;">Founding President</span>
    <h2 class="board-name" style="color: #0f172a !important; margin: 0 0 8px 0 !important; font-size: 1.5rem !important;">Darren Dong</h2>
    <p class="board-bio" style="color: #334155 !important; margin: 0 !important; line-height: 1.5 !important;">
      I'm Darren and i'm not very good at escape rooms, but my good friend Zia is awesome at them.
    </p>
  </div>

</div>

      <!-- Member 2 
      <div class="board-member-row">
        <div class="board-photo-card">
          <img src="Zia.png" alt="Zia">
        </div>
        <div class="board-text-card">
          <span class="role-badge">Idk what my role is actually</span>
          <h2 class="board-name">Zia Chan</h2>
          <p class="board-bio">
            HI
          </p>
        </div>
      </div> -->

    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const closeBtn = document.getElementById('closeBtn');
      const sideMenu = document.getElementById('sideMenu');
      const menuOverlay = document.getElementById('menuOverlay');

      function closeMenu() {
        if (sideMenu) sideMenu.classList.remove('active');
        if (menuOverlay) menuOverlay.classList.remove('active');
      }

      if (closeBtn) closeBtn.addEventListener('click', closeMenu);
      if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);
    });
  </script>
</body>
</html>
