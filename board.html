<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StuySkates - Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="board-page">

  <!-- Header Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="StuySkatesLogo.png" alt="StuySkates Logo" class="nav-logo-img">
      </a>
    </div>
    <div class="nav-center">
      <a href="index.html" class="brand-title">StuySkates</a>
    </div>
    <div class="nav-right">
      <a href="contact.html" class="contact-btn">Contact</a>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="side-menu" id="sideMenu">
    <button class="close-btn" id="closeBtn" aria-label="Close Menu">&times;</button>
    <nav class="side-nav-links">
      <a href="index.html">Home</a>
      <a href="board.html" class="active">Board</a>
      <a href="photos.html">Photos</a>
      <a href="resources.html">Resources</a>
      <a href="contact.html">Contact</a>
    </nav>
  </aside>

 <!-- Main Content Wrapper -->
  <main style="max-width: 950px; margin: 0 auto; padding: 120px 20px 60px 20px;">
    
    <div style="text-align: center; margin-bottom: 40px;">
      <h1 style="font-size: 2.5rem; font-weight: 700; color: #ffffff; margin-bottom: 12px;">StuySkates Board</h1>
      <p style="font-size: 1.1rem; color: #cbd5e1; margin: 0;">Meet the team running the StuySkates club this year!</p>
    </div>

    <div class="board-container" style="display: flex; flex-direction: column; width: 100%; gap: 24px;">

      <!-- Member 1: Darren -->
      <div class="board-member-row" style="display: flex; flex-direction: row; width: 100%; gap: 20px; align-items: center;">
        
        <div class="board-photo-card" style="flex: 0 0 180px; width: 180px; height: 240px; border-radius: 20px; overflow: hidden; background-color: #ffffff; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);">
          <img src="Darren.jpg" alt="Darren" style="width: 100%; height: 100%; max-width: 180px; max-height: 240px; object-fit: cover; display: block;">
        </div>

        <div class="board-text-card" style="flex: 1; height: 240px; background-color: #ffffff; border-radius: 20px; padding: 24px 32px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); box-sizing: border-box;">
          <span class="role-badge" style="background-color: #e0f2fe; color: #0369a1; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; border-radius: 12px; text-transform: uppercase; margin-bottom: 8px;">Founding President</span>
          <h2 class="board-name" style="font-size: 1.6rem; font-weight: 700; color: #0f172a; margin: 0 0 8px 0;">Darren Dong</h2>
          <p class="board-bio" style="font-size: 0.95rem; color: #334155; line-height: 1.5; margin: 0;">
            I'm Darren and i'm not very good at escape rooms, but my good friend Zia is awesome at them.
          </p>
        </div>

      </div>

      <!-- Zia -->
      <div class="board-member-row" style="display: flex; flex-direction: row; width: 100%; gap: 20px; align-items: center;">
        
        <div class="board-photo-card" style="flex: 0 0 180px; width: 180px; height: 240px; border-radius: 20px; overflow: hidden; background-color: #ffffff; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);">
          <img src="Zia.png" alt="Zia" style="width: 100%; height: 100%; max-width: 180px; max-height: 240px; object-fit: cover; display: block;">
        </div>

        <div class="board-text-card" style="flex: 1; height: 240px; background-color: #ffffff; border-radius: 20px; padding: 24px 32px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); box-sizing: border-box;">
          <span class="role-badge" style="background-color: #e0f2fe; color: #0369a1; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; border-radius: 12px; text-transform: uppercase; margin-bottom: 8px;">Vice President</span>
          <h2 class="board-name" style="font-size: 1.6rem; font-weight: 700; color: #0f172a; margin: 0 0 8px 0;">Zia Chan</h2>
          <p class="board-bio" style="font-size: 0.95rem; color: #334155; line-height: 1.5; margin: 0;">
            HI
          </p>
        </div>

      </div>

    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const closeBtn = document.getElementById('closeBtn');
      const sideMenu = document.getElementById('sideMenu');
      const menuOverlay = document.getElementById('menuOverlay');

      function closeMenu() {
        if (sideMenu) sideMenu.classList.remove('active');
        if (menuOverlay) menuOverlay.classList.remove('active');
      }

      if (closeBtn) closeBtn.addEventListener('click', closeMenu);
      if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);
    });
  </script>
</body>
</html>
