<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StuySkates - Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="board-page">

  <!-- Header Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="StuySkatesLogo.png" alt="StuySkates Logo" class="nav-logo-img">
      </a>
    </div>
    <div class="nav-center">
      <a href="index.html" class="brand-title">StuySkates</a>
    </div>
    <div class="nav-right">
      <a href="contact.html" class="contact-btn">Contact</a>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="side-menu" id="sideMenu">
    <button class="close-btn" id="closeBtn" aria-label="Close Menu">&times;</button>
    <nav class="side-nav-links">
      <a href="index.html">Home</a>
      <a href="board.html" class="active">Board</a>
      <a href="photos.html">Photos</a>
      <a href="resources.html">Resources</a>
      <a href="contact.html">Contact</a>
    </nav>
  </aside>

  <main class="board-wrapper">
    
    <div class="board-header">
      <h1 class="board-main-title">StuySkates Board</h1>
      <p class="board-subtitle">Meet the team running the StuySkates club this year!</p>
    </div>

    <div class="board-container">

      <!-- Member 1 -->
      <div class="board-member-row">
        <div class="board-photo-card">
          <img src="Darren.jpg" alt="Darren">
        </div>
        <div class="board-text-card">
          <span class="role-badge"> Founding President</span>
          <h2 class="board-name">Darren Dong</h2>
          <p class="board-bio">
            I'm Darren and i'm not very good at escape rooms, but my good friend Zia is awesome at them.
          </p>
        </div>
      </div>

      <!-- Member 2 -->
      <div class="board-member-row">
        <div class="board-photo-card">
          <img src="Zia.png" alt="Zia">
        </div>
        <div class="board-text-card">
          <span class="role-badge">Idk what my role is actually</span>
          <h2 class="board-name">Zia Chan</h2>
          <p class="board-bio">
            HI
          </p>
        </div>
      </div>

    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const closeBtn = document.getElementById('closeBtn');
      const sideMenu = document.getElementById('sideMenu');
      const menuOverlay = document.getElementById('menuOverlay');

      function closeMenu() {
        if (sideMenu) sideMenu.classList.remove('active');
        if (menuOverlay) menuOverlay.classList.remove('active');
      }

      if (closeBtn) closeBtn.addEventListener('click', closeMenu);
      if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);
    });
  </script>
</body>
</html>
